[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad-risk"
version = "0.1.0"
description = "Leakage-resistant early academic risk prediction on the Open University Learning Analytics Dataset (OULAD)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nurtay Turlubekov" }]
keywords = ["learning analytics", "OULAD", "early warning", "machine learning", "data leakage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "build>=1.0", "pre-commit>=3.5"]

[project.scripts]
oulad-risk = "oulad_risk.cli:main"

[project.urls]
Dataset = "https://www.kaggle.com/datasets/anlgrbz/student-demographics-online-education-dataoulad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["oulad_risk"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
# Upper-case X / X_tr is the scikit-learn convention for feature matrices.
ignore = ["N806", "N803"]
