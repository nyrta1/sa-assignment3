# Continuous delivery: pushing a version tag (e.g. v0.1.0) tests, builds and publishes
# a GitHub Release with the wheel and source distribution attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import oulad_risk; print(oulad_risk.__version__)")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$PKG"; exit 1; }
      - run: pytest -q
      - run: python -m build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
